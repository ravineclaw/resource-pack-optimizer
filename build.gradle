plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

loom {
	runs {
		client {
			if (project.hasProperty("rpoSelftest")) {
				vmArg "-Drpo.selftest=true"
				vmArg "-Drpo.selftest.tag=${project.findProperty('rpoTag') ?: 'run'}"
				if (project.hasProperty("rpoWorld")) {
					vmArg "-Drpo.selftest.world=true"
				}
			}
			if (project.hasProperty("rpoBench")) {
				vmArg "-Drpo.bench=${project.findProperty('rpoBench')}"
				vmArg "-Drpo.bench.runs=${project.findProperty('rpoRuns') ?: '5'}"
				if (project.hasProperty("rpoShow")) {
					vmArg "-Drpo.bench.show=true"
				}
				if (project.hasProperty("rpoScout")) {
					vmArg "-Drpo.bench.scout=true"
				}
				if (project.hasProperty("rpoRejoin")) {
					vmArg "-Drpo.bench.rejoin=true"
				}
				if (project.hasProperty("rpoPos")) {
					vmArg "-Drpo.bench.pos=${project.findProperty('rpoPos')}"
				}
			}
			if (project.hasProperty("rpoJfr")) {
				vmArg "-XX:StartFlightRecording=filename=${project.findProperty('rpoJfr')},settings=profile"
			}
			if (project.hasProperty("rpoDisable")) {
				vmArg "-Drpo.disable=true"
			}
		}
	}
}

repositories {
	maven {
		url = "https://api.modrinth.com/maven"
		content {
			includeGroup "maven.modrinth"
		}
	}
	maven {
		url = "https://maven.terraformersmc.com/releases/"
		content {
			includeGroup "com.terraformersmc"
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modCompileOnly("com.terraformersmc:modmenu:${project.modmenu_version}") {
		transitive = false
	}
	if (project.hasProperty("rpoSodium")) {
		modRuntimeOnly "maven.modrinth:sodium:${project.findProperty('rpoSodium')}"
	}
	if (project.hasProperty("rpoSodiumExtra")) {
		modRuntimeOnly "maven.modrinth:sodium-extra:${project.findProperty('rpoSodiumExtra')}"
	}
	if (project.hasProperty("rpoIris")) {
		modRuntimeOnly "maven.modrinth:iris:${project.findProperty('rpoIris')}"
	}
	if (project.hasProperty("rpoFabricApi")) {
		modRuntimeOnly "net.fabricmc.fabric-api:fabric-api:${project.findProperty('rpoFabricApi')}"
	}
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.encoding = "UTF-8"
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName" }
	}
}
